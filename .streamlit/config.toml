# One light appearance. Minimal toolbar removes the viewer theme selector.
# Charts also use an explicit light template in app/ui.py.
[theme]
base = "light"
primaryColor = "#2458C6"
backgroundColor = "#F6F8FB"
secondaryBackgroundColor = "#EEF2F7"
textColor = "#25324A"
font = "sans serif"

[client]
showSidebarNavigation = false
toolbarMode = "minimal"

[server]
headless = true

[browser]
gatherUsageStats = false
