# A calm, high-contrast default for the lab and presentation screens.
# Shared surfaces derive from Streamlit's theme variables in app/styles.css.
[theme]
base = "dark"
primaryColor = "#6AAFFF"
backgroundColor = "#151619"
secondaryBackgroundColor = "#202226"
textColor = "#F2F3F5"
font = "sans serif"

[client]
showSidebarNavigation = false

[server]
headless = true

[browser]
gatherUsageStats = false
